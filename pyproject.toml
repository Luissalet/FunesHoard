[project]
name = "funes-hoard"
version = "0.1.0"
description = "Funes's Hoard - your computer's episodic memory, kept on your computer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luissalet" }]
urls = { Repository = "https://github.com/Luissalet/FunesHoard" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "pydantic==2.10.3",
    "httpx==0.28.1",
    "mcp==1.9.0",
    "psutil==6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["funes_hoard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
